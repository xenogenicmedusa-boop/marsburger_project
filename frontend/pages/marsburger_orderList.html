<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MARS Burger｜後台訂單管理</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="../css/bootstrap.min.css">
  <style>
    body{background:#0d1117;color:#e8edf3}.navbar{background:#161b22;border-bottom:2px solid #ff6b35}.card,.table-wrap{background:#161b22;border:1px solid #30363d;border-radius:12px}.metric{font-size:2rem;font-weight:700}.badge-pending{background:#f59e0b}.badge-processing{background:#0284c7}.badge-completed{background:#16a34a}.badge-cancelled{background:#dc2626}.table{--bs-table-bg:transparent;--bs-table-color:#e8edf3;--bs-table-border-color:#30363d}.form-select{min-width:110px}.login-panel{max-width:430px;margin:12vh auto}.status-dot{width:9px;height:9px;background:#28c76f;border-radius:50%;display:inline-block;box-shadow:0 0 10px #28c76f}.meal{font-size:.85rem;color:#aab5c2}
  </style>
</head>
<body>
  <nav class="navbar navbar-dark"><div class="container"><span class="navbar-brand fw-bold">MARS BURGER｜營運後台</span><div id="navUser"></div></div></nav>
  <main class="container py-4" id="adminApp" hidden>
    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-4"><div><h1 class="h3 mb-1">訂單管理中心</h1><small class="text-secondary"><span class="status-dot"></span> 手動更新・最後更新：<span id="updatedAt">—</span></small></div><div class="d-flex gap-2"><select id="period" class="form-select form-select-sm"><option value="day">本日</option><option value="week">本週</option><option value="month" selected>本月</option><option value="all">全部</option></select><button id="refresh" class="btn btn-outline-light btn-sm">重新整理</button><button id="csv" class="btn btn-warning btn-sm">匯出 CSV 報表</button></div></div>
    <div class="row g-3 mb-4" id="metrics"></div>
    <div class="table-wrap p-3"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">即時訂單</h2><span id="orderCount" class="badge text-bg-secondary"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>訂單</th><th>顧客／餐點</th><th>付款／取餐</th><th>金額</th><th>成立時間</th><th>狀態</th><th>儲存</th></tr></thead><tbody id="orders"><tr><td colspan="7" class="text-center text-secondary py-4">載入中…</td></tr></tbody></table></div></div>
  </main>
  <section class="login-panel card p-4" id="loginPanel"><h1 class="h4 mb-3">管理員登入</h1><p class="text-secondary small">請以管理員帳號登入後台。</p><form id="loginForm"><input name="account" class="form-control mb-2" placeholder="帳號或 Email" required><input name="password" type="password" class="form-control mb-3" placeholder="密碼" required><button class="btn btn-warning w-100">登入後台</button><p class="small text-danger mt-3 mb-0" id="loginError"></p></form></section>
  <script>
    const API = `${location.protocol}//${location.hostname || 'localhost'}:3000/api`;
    document.querySelector('.navbar .container').insertAdjacentHTML('beforeend', '<a href="../index.html" class="btn btn-sm btn-outline-warning ms-2">回首頁</a>');
    const statusNames = {pending:'待處理',processing:'製作中',completed:'已完成',cancelled:'已取消'};
    const token = () => localStorage.getItem('mars_token');
    const user = () => JSON.parse(localStorage.getItem('mars_user') || 'null');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function api(path, options={}) { const response = await fetch(API + path, { ...options, headers:{'Content-Type':'application/json',Authorization:`Bearer ${token()}`, ...(options.headers||{})} }); const data = response.headers.get('content-type')?.includes('application/json') ? await response.json() : await response.blob(); if (!response.ok) throw new Error(data.message || '操作失敗'); return data; }
    function logout(){localStorage.removeItem('mars_token');localStorage.removeItem('mars_user');location.reload();}
    function showApp(){document.querySelector('#loginPanel').hidden=true;document.querySelector('#adminApp').hidden=false;document.querySelector('#navUser').innerHTML=`<span class="text-light small me-2">${esc(user().username)}</span><button class="btn btn-sm btn-outline-light" onclick="logout()">登出</button>`;load();}
    async function load(){try{const period=document.querySelector('#period').value;const [dashboard,orderData]=await Promise.all([api(`/dashboard?period=${period}`),api('/orders')]);const total=dashboard.totals;document.querySelector('#metrics').innerHTML=[['訂單數',total.orderCount,'本選取期間'],['營收',`NT$ ${Number(total.revenue).toLocaleString()}`,'不含已取消'],['已完成',total.completed,'完成訂單'],['完成率',total.orderCount?`${Math.round(total.completed/total.orderCount*100)}%`:'0%','已完成／全部']].map(x=>`<div class="col-6 col-lg-3"><div class="card p-3"><small class="text-secondary">${x[0]}</small><div class="metric">${x[1]}</div><small class="text-secondary">${x[2]}</small></div></div>`).join('');document.querySelector('#orderCount').textContent=`共 ${orderData.orders.length} 筆`;document.querySelector('#orders').innerHTML=orderData.orders.length?orderData.orders.map(o=>`<tr><td><b>${esc(o.orderNumber)}</b><br><small class="text-secondary">#${o.id}</small></td><td>${esc(o.customerName)}<div class="meal">${o.meals.map(m=>`${esc(m.name)} × ${Number(m.quantity||1)}`).join('、')}</div></td><td>${esc(o.payType)}<br><small class="text-secondary">${esc(o.pickupType)}</small></td><td>NT$ ${Number(o.totalPrice).toLocaleString()}</td><td><small>${new Date(o.createdAt).toLocaleString('zh-TW')}</small></td><td><span class="badge badge-${o.status}">${statusNames[o.status]||esc(o.status)}</span></td><td><select class="form-select form-select-sm" data-id="${o.id}" data-current="${o.status}">${Object.entries(statusNames).map(([value,label])=>`<option value="${value}" ${value===o.status?'selected':''}>${label}</option>`).join('')}</select><button class="btn btn-sm btn-warning mt-1 save-status" data-id="${o.id}">更新</button></td></tr>`).join(''):'<tr><td colspan="7" class="text-center text-secondary py-4">尚無訂單</td></tr>';document.querySelector('#updatedAt').textContent=new Date().toLocaleTimeString('zh-TW');}catch(error){if(/登入|權限/.test(error.message)){logout();return;}alert(error.message);}}
    document.querySelector('#loginForm').onsubmit=async event=>{event.preventDefault();try{const data=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});if(data.user.role!=='admin')throw new Error('此帳號沒有管理員權限。');localStorage.setItem('mars_token',data.token);localStorage.setItem('mars_user',JSON.stringify(data.user));showApp();}catch(error){document.querySelector('#loginError').textContent=error.message;}};
    document.querySelector('#orders').onclick=async event=>{if(!event.target.classList.contains('save-status'))return;const id=event.target.dataset.id;const status=document.querySelector(`select[data-id="${id}"]`).value;event.target.disabled=true;try{await api(`/orders/${id}`,{method:'PATCH',body:JSON.stringify({status})});await load();}catch(error){alert(error.message);event.target.disabled=false;}};
    document.querySelector('#refresh').onclick=load;document.querySelector('#period').onchange=load;
    document.querySelector('#csv').onclick=async()=>{try{const blob=await api(`/dashboard/report.csv?period=${document.querySelector('#period').value}`);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marsburger-sales-report.csv';a.click();URL.revokeObjectURL(a.href);}catch(error){alert(error.message);}};
    user()?.role==='admin'?showApp():null;
  </script>
</body>
</html>
